name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Test CLI init/verify
        run: |
          memory-index-init /tmp/demo-project
          memory-index-verify /tmp/demo-project/.memory

      - name: Test CLI init/verify with a signing key
        run: |
          memory-index-init /tmp/demo-project-signed
          memory-index-verify /tmp/demo-project-signed/.memory
        env:
          KIMI_MEMORY_KEY: ci-test-key

      - name: Test registry scan/list/search
        run: |
          memory-index-registry-scan /tmp/demo-project /tmp/demo-project-signed --registry-dir /tmp/demo-registry
          memory-index-registry-list --registry-dir /tmp/demo-registry
          memory-index-registry-search demo --registry-dir /tmp/demo-registry

      - name: Test registry diff (no-op case)
        run: memory-index-registry-diff /tmp/demo-project/.memory --registry-dir /tmp/demo-registry

      - name: Test sign --expect-revision optimistic concurrency
        run: |
          memory-index-sign /tmp/demo-project/.memory --expect-revision 1
          # a second attempt with the now-stale revision must be refused
          if memory-index-sign /tmp/demo-project/.memory --expect-revision 1; then
            echo "expected the stale-revision sign to fail, but it succeeded" >&2
            exit 1
          fi
